name: nusadhipa_business_mobile
description: NUSA-DHIPA Business Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^10.0.0
  intl: ^0.20.2
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  http_parser: ^4.1.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.3
  flutter_native_splash: ^2.4.7
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  archive: ^4.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/branding/
    - assets/placeholder.png
    - assets/products/

flutter_native_splash:
  color: "#E5232E"
  image: "assets/images/logo.png"
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: scaleDown
  fullscreen: true

  android_12:
    image: "assets/images/logo.png"
    color: "#E5232E"
    icon_background_color: "#FFFFFF"